spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cookie:
    secure: true

logging:
  level:
    com.freelancehub: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
