spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/freelancehub}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-on-validation-error: false


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  platform-fee-percent: 10.0

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:FreelanceHub <onboarding@resend.dev>}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dxcepaoal}
  api-key: ${CLOUDINARY_API_KEY:322625819845765}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  email:
    dev-override: ${EMAIL_DEV_OVERRIDE:}
  cookie:
    secure: false
    same-site: Lax
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  internal:
    secret: ${INTERNAL_API_SECRET}

logging:
  level:
    com.freelancehub: DEBUG
    org.springframework.security: TRACE

server:
  port: ${PORT:8080}
